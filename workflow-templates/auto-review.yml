# Auto-assign Astra for code review on Diego's PRs.
# Copy to .github/workflows/auto-review.yml in any repo.
name: Auto Review Assignment

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign-reviewer:
    if: github.event.pull_request.user.login == 'DiegoAi11' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Request review from Astra
        uses: actions/github-script@v7
        with:
          script: |
            // Request review
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: ['AstraAi11']
            });

            // Post comment to trigger notification
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `@AstraAi11 PR ready for code review.\n\n**Author:** ${context.payload.pull_request.user.login}\n**Branch:** \`${context.payload.pull_request.head.ref}\` → \`${context.payload.pull_request.base.ref}\``
            });
